<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
        h1, label, input {
            margin-bottom: 8px;
        }
        .row {
            max-width: 1024px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="col">
            <form>
                <h1>Cadastre-se</h1>
                <label for="Nome" class="label-control">Nome</label>
                <input type="text" class="form-control" id="Nome" required>
                <label for="email" class="label-control">Email</label>
                <input type="email" class="form-control" id="email" required>
                <label for="" class="label-control">Telefone</label>
                <input type="text" class="form-control" required>
                <button class="btn btn-outline-dark">Cadastrar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"></script>
</body>
</html>
